plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        mixinConfig "infusion_table.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_description", rootProject.mod_description
    inputs.property "mod_name", rootProject.mod_description
    inputs.property "mod_authors", rootProject.mod_authors
    inputs.property "forge_forge_version", rootProject.forge_forge_version
    inputs.property "forge_minecraft_version", rootProject.forge_minecraft_version
    inputs.property "forge_architectury_version", rootProject.forge_architectury_version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version,
                "mod_description": rootProject.mod_description,
                "mod_name": rootProject.mod_name,
                "mod_authors": rootProject.mod_authors,
                "forge_forge_version": rootProject.forge_forge_version,
                "forge_minecraft_version": rootProject.forge_minecraft_version,
                "forge_architectury_version": rootProject.forge_architectury_version
    }

}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
