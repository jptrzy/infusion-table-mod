plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_description", rootProject.mod_description
    inputs.property "mod_name", rootProject.mod_description
    inputs.property "mod_authors", rootProject.mod_authors
    inputs.property "neoforge_loader_version", rootProject.neoforge_loader_version
    inputs.property "neoforge_neoforge_version", rootProject.neoforge_neoforge_version
    inputs.property "neoforge_minecraft_version", rootProject.neoforge_minecraft_version
    inputs.property "neoforge_architectury_version", rootProject.neoforge_architectury_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand "version": project.version,
                "mod_description": rootProject.mod_description,
                "mod_name": rootProject.mod_name,
                "mod_authors": rootProject.mod_authors,
                "neoforge_loader_version": rootProject.neoforge_loader_version,
                "neoforge_neoforge_version": rootProject.neoforge_neoforge_version,
                "neoforge_minecraft_version": rootProject.neoforge_minecraft_version,
                "neoforge_architectury_version": rootProject.neoforge_architectury_version
    }

}

jar {
    archiveClassifier = 'dev'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}