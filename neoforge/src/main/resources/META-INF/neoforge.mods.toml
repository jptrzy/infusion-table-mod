modLoader = "javafml"
loaderVersion = "${neoforge_loader_version}"
license = "All Rights Reserved"
issueTrackerURL = "https://github.com/jptrzy/infusion-table-mod/issues"

[[mods]]
modId = "infusion_table"
version = "${version}"
displayName = "${mod_name}"
#updateJSONURL="http://myurl.me/" #optional
#displayURL="http://example.com/" #optional
logoFile = "icon.png"
authors="${mod_authors}"
description = '''${mod_description}'''

[[dependencies.infusion_table]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_neoforge_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.infusion_table]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_minecraft_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.infusion_table]]
modId = "architectury"
type = "required"
versionRange = "${neoforge_architectury_version}"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "infusion_table.mixins.json"