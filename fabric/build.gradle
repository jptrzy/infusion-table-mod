plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_name", rootProject.mod_name
    inputs.property "mod_description", rootProject.mod_description
    inputs.property "fabric_fabric_api_version", rootProject.fabric_fabric_api_version
    inputs.property "fabric_fabric_loader_version", rootProject.fabric_fabric_loader_version
    inputs.property "fabric_minecraft_version", rootProject.fabric_minecraft_version
    inputs.property "fabric_architectury_version", rootProject.fabric_architectury_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "mod_name": rootProject.mod_name,
                "mod_description": rootProject.mod_description,
                "fabric_fabric_api_version": rootProject.fabric_fabric_api_version,
                "fabric_fabric_loader_version": rootProject.fabric_fabric_loader_version,
                "fabric_minecraft_version": rootProject.fabric_minecraft_version,
                "fabric_architectury_version": rootProject.fabric_architectury_version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
